name: SpokeMap APK

on:
  push:
    branches: ["**"]
    paths:
      - "spokemap/**"
      - ".github/workflows/spokemap.yml"
  pull_request:
    paths:
      - "spokemap/**"
      - ".github/workflows/spokemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spokemap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spokemap
    env:
      # Each run gets a higher versionCode, so a new APK installs over the old one.
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Without a release keystore the APK is signed with a debug key. Caching that key keeps
      # the signature the same between runs, so updates still install over each other
      # (the cache expires after 7 days without a build).
      - name: Reuse fallback debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spokemap-debug-keystore

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "kind=release key" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore from repository secrets."
          else
            echo "kind=debug key (no release keystore configured)" >> "$GITHUB_OUTPUT"
            echo "::warning title=Debug-signed APK::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a debug key. Add the four ANDROID_* secrets described in the top-level README.md to sign with your own key."
          fi

      - name: Test and build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: |
          VERSION="1.0.${VERSION_CODE}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SpokeMap-${VERSION}.apk"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: SpokeMap-${{ env.APP_VERSION }}
          path: spokemap/dist/*.apk

      # Releases are published from main (and on manual runs), never from feature branches or PRs.
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spokemap-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: SpokeMap ${{ env.APP_VERSION }}
          body: |
            SpokeMap ${{ env.APP_VERSION }}, built from ${{ github.sha }}.
            Signed with: ${{ steps.signing.outputs.kind }}.

            Download the APK below and open it on your phone to install.
          files: spokemap/dist/*.apk
          make_latest: true
